name: Algorithm Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run algorithm tests
        run: npx jest LinearSearchList BinarySearchList Stack BTBFS TwoCrystalBalls CompareBinaryTrees BubbleSort SinglyLinkedList DijkstraList